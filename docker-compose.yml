services:
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - mlops-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlflow-server
    ports:
      - "5000:5000"
    environment:
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "300"
    volumes:
      - ./mlflow:/mlflow
    command: >
      mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    networks:
      - mlops-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-k9Yp3n7sQ8tBv2LxZ4mR0uF1wE6hC5aG}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/app/src
      - ./monitoring:/app/monitoring
      - ./mlflow:/mlflow
    ports:
      - "${AIRFLOW_WEBSERVER_HOST_PORT:-8080}:8080"
    networks:
      - mlops-network
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    command: >
      bash -c "airflow db init &&
               airflow users create --username $${AIRFLOW_USERNAME:-admin} --password $${AIRFLOW_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email $${AIRFLOW_EMAIL:-admin@example.com} || true &&
               airflow webserver"

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-k9Yp3n7sQ8tBv2LxZ4mR0uF1wE6hC5aG}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - MLFLOW_HOME=/home/airflow/.mlflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/app/src
      - ./monitoring:/app/monitoring
      - ./mlflow:/mlflow
      - airflow-mlflow-cache:/home/airflow/.mlflow
    networks:
      - mlops-network
    restart: unless-stopped
    command: airflow scheduler

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-api
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres-mlops}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - MLOPS_DB_NAME=${MLOPS_DB_NAME:-mlops}
      - POSTGRES_USER=${POSTGRES_USER:-mlops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mlops}
    volumes:
      - ./src:/app/src
      - ./monitoring:/app/monitoring
      - ./mlflow:/mlflow
    networks:
      - mlops-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  monitoring-job:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: mlops-monitoring-job
    depends_on:
      api:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - MONITORING_INTERVAL=${MONITORING_INTERVAL:-300}
      - MONITORING_LOOKBACK=${MONITORING_LOOKBACK:-24}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres-mlops}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - MLOPS_DB_NAME=${MLOPS_DB_NAME:-mlops}
      - POSTGRES_USER=${POSTGRES_USER:-mlops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mlops}
    volumes:
      - ./src:/app/src
      - ./monitoring:/app/monitoring
      - ./scripts:/app/scripts
      - ./data:/app/data
    networks:
      - mlops-network
    env_file:
      - .env
    restart: unless-stopped
    command: python -m src.orchestration.scheduler

  # ============================================================
  # PostgreSQL for MLOps (separate from Airflow)
  # ============================================================
  postgres-mlops:
    image: postgres:13
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      POSTGRES_DB: ${MLOPS_DB_NAME:-mlops}
    volumes:
      - postgres-mlops-volume:/var/lib/postgresql/data
      - ./scripts/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5433:5432" # Different port to avoid conflict with Airflow
    networks:
      - mlops-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-mlops}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres-mlops
    networks:
      - mlops-network

volumes:
  postgres-db-volume:
  airflow-mlflow-cache:
  postgres-mlops-volume:

networks:
  mlops-network:
    driver: bridge